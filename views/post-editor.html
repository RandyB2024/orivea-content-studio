<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Nieuwe post | ORIVÈA</title><link rel="stylesheet" href="/css/dashboard.css"></head><body data-studio-page="post-editor"><div class="app-shell"><aside class="sidebar" data-nav></aside><main class="main"><header class="page-head"><p class="eyebrow">Post editor</p><h1>Maak een post</h1><p>Iedere publicatie blijft een gecontroleerd voorstel tot jij deze goedkeurt.</p></header><div id="message"></div><section class="panel"><form id="postForm" class="studio-form"><label class="wide">Content<select id="contentSelect" name="content_item_id" required></select></label><label class="wide">Titel<input name="title"></label><fieldset class="wide platform-picker"><legend>Kanalen</legend><label><input type="checkbox" name="platforms" value="instagram"> Instagram</label><label><input type="checkbox" name="platforms" value="facebook"> Facebook</label><label><input type="checkbox" name="platforms" value="tiktok"> TikTok</label><label><input type="checkbox" name="platforms" value="pinterest"> Pinterest</label></fieldset><label>CTA<input name="cta"></label><label>Doel-URL<input type="url" name="target_url" value="https://orivea.nl/catalogus.html"></label><label class="wide">Instagram caption<textarea name="caption_instagram"></textarea></label><label class="wide">Facebook caption<textarea name="caption_facebook"></textarea></label><label class="wide">TikTok caption<textarea name="caption_tiktok"></textarea></label><label class="wide">Pinterest beschrijving<textarea name="caption_pinterest"></textarea></label><label class="wide">Goedkeuren en plannen op<input id="scheduledAt" type="datetime-local"></label><button class="button button-primary">Post opslaan</button></form></section></main></div><script src="/js/dashboard.js"></script><script src="/js/studio.js"></script></body></html>
