<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Contentbibliotheek | ORIVÈA</title><link rel="stylesheet" href="/css/dashboard.css"></head>
<body data-studio-page="content"><div class="app-shell"><aside class="sidebar" data-nav></aside><main class="main">
<header class="page-head"><p class="eyebrow">Bibliotheek</p><h1>Contentvoorraad</h1><p>Bewaar eigen materiaal en content die je van Glantier of via WhatsAppgroepen ontvangt.</p></header><div id="message"></div>
<details class="panel form-panel"><summary>+ Content toevoegen</summary><form id="contentForm" class="studio-form">
<label>Titel<input name="title" required maxlength="180"></label><label>Bron<select name="source_type"><option value="orivea">ORIVÈA</option><option value="glantier">Glantier</option><option value="whatsapp">WhatsAppgroep</option><option value="other">Anders</option></select></label>
<label>Categorie<input name="category" required></label><label>Contenttype<input name="content_type" required></label><label class="wide">Media<input type="file" name="media" accept=".jpg,.jpeg,.png,.webp,.mp4,.mov" multiple></label>
<label class="wide">Originele caption<textarea name="caption_original"></textarea></label><label class="wide">ORIVÈA caption<textarea name="caption_orivea"></textarea></label>
<label>Product / referentie<input name="product_reference"></label><label>Campagne<select name="campaign_id" id="campaignSelect"><option value="">Geen campagne</option></select></label>
<label>Gebruiksrechten<select name="usage_permission"><option value="unknown">Onbekend</option><option value="own_content">Eigen content</option><option value="approved">Goedgekeurd</option><option value="shared_by_glantier">Gedeeld door Glantier</option></select></label>
<label>Geldig vanaf<input type="date" name="valid_from"></label><label>Geldig tot<input type="date" name="valid_until"></label><label class="wide">Notities<textarea name="notes"></textarea></label><button class="button button-primary">Opslaan</button>
</form></details>
<div class="media-toolbar"><span id="selectionCount">0 geselecteerd</span><button class="button button-secondary" id="carouselButton" type="button" disabled>Maak carousel</button></div>
<section id="contentGrid" class="content-grid"></section></main></div><script src="/js/dashboard.js"></script><script src="/js/studio.js"></script></body></html>
